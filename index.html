<!DOCTYPE html>
<html>
<head>
    <title>To Observe A Fungus</title>
    <style>
        @font-face {
            font-family: "MyFont";
            src: url("./fonts/MyFont.ttf") format("truetype");
        }

        body {
            margin: 0;
            background: black;
            color: green;
            font-family: "MyFont", monospace;
            overflow: hidden;
            white-space: pre-wrap;
        }

        #garbage {
            padding: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="garbage"></div>

    <script>
        const chars =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

        const output = document.getElementById("garbage");

        function randomGarbage(length) {
            let text = "";

            for (let i = 0; i < length; i++) {
                text += chars[Math.floor(Math.random() * chars.length)];

                if (Math.random() < 0.015)
                    text += "\n";
            }

            return text;
        }

        function update() {
            output.textContent = randomGarbage(100);
        }

        update();
        setInterval(update, 100);
    </script>
</body>
</html>
