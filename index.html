<!DOCTYPE html>
<html>
<head>
    <title>To Observe A Fungus</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: green;
            font-family: monospace;
            font-size: 32px;
            overflow: hidden;
            cursor: pointer;
        }

        #content {
            padding: 20px;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div id="content">PRESS TO BEGIN.</div>

    <audio id="daisybell" src="./DaisyBell.mp3"></audio>

    <script>
        const output = document.getElementById("content");
        const audio = document.getElementById("daisybell");

        let started = false;
        let position = 0;

        document.body.addEventListener("click", function () {
            if (started)
                return;

            started = true;
            output.textContent = "";

            audio.play();

            fetch("./content.txt")
                .then(response => {
                    if (!response.ok)
                        throw new Error("Could not load content.txt");

                    return response.text();
                })
                .then(text => {
                    function printCharacter() {
                        if (position >= text.length)
                            return;

                        output.textContent += text[position];
                        position++;

                        window.scrollTo(0, document.body.scrollHeight);

                        setTimeout(printCharacter, 125);
                    }

                    printCharacter();
                })
                .catch(error => {
                    output.textContent = error.message;
                });
        });
    </script>
</body>
</html>
