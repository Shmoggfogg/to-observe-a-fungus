<!DOCTYPE html>
<html>
<head>
    <title>To Observe A Fungus</title>
    <style>
        @font-face {
            font-family: "MyFont";
            src: url("./fonts/MyFont.ttf") format("truetype");
        }

        body {
            margin: 0;
            background: black;
            color: green;
            font-family: "MyFont", monospace;
            overflow: hidden;
            white-space: pre-wrap;
        }

        #content {
            padding: 10px;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div id="content"></div>

    <script>
        const output = document.getElementById("content");

        fetch("content.txt")
            .then(response => response.text())
            .then(text => {
                let position = 0;

                function printCharacter() {
                    if (position < text.length) {
                        output.textContent += text[position];
                        position++;
                        setTimeout(printCharacter, 1000 / 8);
                    }
                }

                printCharacter();
            })
            .catch(error => {
                output.textContent = "ERROR: " + error;
            });
    </script>
</body>
</html>
